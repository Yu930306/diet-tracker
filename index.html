<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="饮食记录">
<meta name="theme-color" content="#f6f1e7">
<title>饮食记录</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f1e7; color: #2b2620; }
  header { position: sticky; top: 0; background: #f6f1e7; z-index: 10; padding: 12px 16px 0; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .profiles { display: flex; gap: 8px; margin-bottom: 10px; }
  .profiles button { flex: 1; padding: 10px; border-radius: 12px; border: 1.5px solid #d8cfbc; background: #fffdf8; font-size: 15px; }
  .profiles button.active { background: #2f5d3a; color: #fff; border-color: #2f5d3a; }
  .profiles button.add-profile { flex: 0 0 auto; padding: 10px 14px; border-style: dashed; background: transparent; color: #2f5d3a; }
  .tabs { display: flex; background: #e9e1cf; border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 10px 0; font-size: 15px; border-radius: 9px; color: #5c5546; }
  .tabs button.active { background: #fffdf8; color: #2b2620; font-weight: 600; }
  main { padding: 0 16px 40px; }
  .card { background: #fffdf8; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card h2 .time { color: #8a7f68; font-weight: 400; font-size: 14px; margin-left: 6px; }
  .muted { color: #8a7f68; font-size: 13px; }
  textarea { width: 100%; min-height: 64px; border: 1px solid #d8cfbc; border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; background: #fbf8ef; resize: vertical; }
  .saved { color: #2f5d3a; font-size: 13px; }
  .foodrow { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #efe8d6; font-size: 15px; }
  .foodrow .del { color: #b3261e; background: none; border: 0; font-size: 15px; }
  .addfood { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .addfood select, .addfood input { padding: 9px; border: 1px solid #d8cfbc; border-radius: 9px; font-size: 15px; background: #fff; }
  .addfood select { flex: 2 1 140px; }
  .addfood input[type=number] { flex: 1 1 70px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; background: #2f5d3a; color: #fff; width: 100%; }
  .btn.secondary { background: #e9e1cf; color: #2b2620; }
  .btn.done { background: #2f5d3a; }
  .btn.notdone { background: #e9e1cf; color: #2b2620; }
  .btn.small { width: auto; padding: 9px 14px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; }
  .thumbs .ph { position: relative; }
  .thumbs .ph button { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 50%; width: 22px; height: 22px; }
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .datenav button { border: 1.5px solid #d8cfbc; background: #fffdf8; border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .datenav .today-label { font-size: 17px; font-weight: 600; }
  /* Countdown page: date black enlarged, days number red enlarged */
  .countdown { text-align: center; padding: 48px 16px; }
  .countdown .cd-date { color: #111; font-size: 34px; font-weight: 700; }
  .countdown .cd-num { color: #c00; font-size: 88px; font-weight: 800; line-height: 1.15; }
  .countdown .cd-unit { color: #c00; font-size: 26px; font-weight: 700; }
  .countdown .cd-note { color: #8a7f68; font-size: 14px; margin-top: 14px; }
  .big { font-size: 26px; font-weight: 700; }
  .weekrow { display: flex; gap: 8px; align-items: center; }
  .weekrow input { flex: 1; padding: 12px; border: 1px solid #d8cfbc; border-radius: 10px; font-size: 17px; }
  #roomGate { text-align: center; padding: 60px 24px; }
  #roomGate input { width: 100%; padding: 14px; font-size: 17px; border: 1.5px solid #d8cfbc; border-radius: 12px; margin: 12px 0; text-align: center; }
  #status { font-size: 13px; color: #8a7f68; text-align: center; padding: 6px 0 12px; }
  #status.err { color: #b3261e; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>饮食记录</h1>
  <div class="profiles" id="profileBar">
    <button data-profile="person1" class="active">档案1</button>
    <button id="addProfileBtn" class="add-profile">+ 添加档案</button>
  </div>
  <div class="tabs">
    <button data-tab="record" class="active">记录</button>
    <button data-tab="weekly">周总结</button>
    <button data-tab="time">时间表</button>
  </div>
  <div id="status"></div>
</header>
<main>
  <div id="roomGate" class="hidden">
    <h2>输入共享房间码</h2>
    <p class="muted">两部手机输入同一个房间码，就能互相看到、互相改。不用账号。</p>
    <input id="roomInput" placeholder="例如：reconet2026" autocomplete="off">
    <button class="btn" id="roomEnter">进入房间</button>
  </div>

  <section id="tab-record">
    <div class="datenav">
      <button id="prevDay">‹ 上一天</button>
      <span class="today-label" id="dateLabel"></span>
      <button id="nextDay">下一天 ›</button>
    </div>
    <div style="text-align:center;margin-bottom:12px"><button class="btn small secondary" id="todayBtn">回到今天</button></div>
    <div id="mealCards"></div>
  </section>

  <section id="tab-weekly" class="hidden">
    <div class="datenav">
      <button id="prevWeek">‹ 上周</button>
      <span class="today-label" id="weekLabel"></span>
      <button id="nextWeek">下周 ›</button>
    </div>
    <div class="card">
      <h2>这一周打卡</h2>
      <p><span class="big" id="weekCheckins">0</span> 次</p>
      <p class="muted">午餐、晚餐、加餐，每打卡一餐算 1 次。</p>
    </div>
    <div class="card">
      <h2>体重记录（一周一次）</h2>
      <p>当前体重：<span id="currentWeight">最近一周还没有体重记录</span></p>
      <div class="weekrow">
        <input id="weightInput" type="number" step="0.1" min="20" max="200" placeholder="体重（斤），如 103">
        <button class="btn small" id="weightSave" style="width:auto">保存</button>
      </div>
      <p class="muted">一周只记一次，填了保存即更新本周这一条。</p>
    </div>
  </section>

  <section id="tab-time" class="hidden">
    <div class="card countdown">
      <div>到 <span class="cd-date" id="cdDate">2026年12月23日</span> 还有</div>
      <div><span class="cd-num" id="cdDays">—</span><span class="cd-unit"> 天</span></div>
      <div class="cd-note" id="cdNote">按系统日期自动算</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
